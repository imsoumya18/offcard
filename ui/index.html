<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShotLoft</title>
<link rel="icon" href="/icon.png">
<style>
  :root {
    --bg: #f4f4f2; --panel: #ffffff; --soft: #f0f0ee; --line: rgba(0,0,0,.12); --text: #1c1c1c;
    --muted: #6b6b6b; --accent: #008787; --accent-soft: #e3f3f3; --attn: #c25500; --good: #1f7a1f;
    --good-soft: #e7f4e7; --bad: #c03c3c; --bad-soft: #fbeaea; --on-accent: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161617; --panel: #1f1f21; --soft: #2a2a2d; --line: rgba(255,255,255,.12); --text: #ececec;
      --muted: #a0a0a0; --accent: #1aa3a3; --accent-soft: #123536; --attn: #f08a3c; --good: #4cbb4c;
      --good-soft: #17301a; --bad: #ef7676; --bad-soft: #3a1d1d; --on-accent: #ffffff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 22px 22px 32px; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  header img { width: 30px; height: 30px; }
  header h1 { font-size: 18px; font-weight: 600; margin: 0; flex: 1; }
  header .ver { font-size: 12px; color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 12px; margin-bottom: 16px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; margin: 0 0 16px; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 13px 15px; min-height: 96px; }
  .box.drop { border: 1.5px dashed var(--accent); }
  .lbl { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .big { font-size: 16px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub { font-size: 12.5px; color: var(--muted); }
  .metric { background: var(--soft); border-radius: 10px; padding: 10px 12px; }
  .metric .n { font-size: 20px; font-weight: 600; }
  .attn { color: var(--attn); } .good { color: var(--good); } .bad { color: var(--bad); }
  button { font: inherit; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 7px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.link { border: 0; background: none; color: var(--accent); padding: 0; font-size: 12.5px; }
  button.primary { width: 100%; height: 46px; background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-size: 16px; font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); }
  .actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; margin-top: 12px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .bar { height: 9px; border-radius: 5px; background: var(--soft); overflow: hidden; margin: 6px 0 4px; }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  .row { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted); }
  .msg { border-radius: 10px; padding: 11px 13px; margin-bottom: 12px; font-size: 14px; }
  .msg.good { background: var(--good-soft); } .msg.bad { background: var(--bad-soft); } .msg.info { background: var(--accent-soft); color: var(--text); }
  .msg b { font-weight: 600; }
  input[type=text] { width: 100%; font: inherit; font-size: 13px; padding: 6px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); margin-top: 6px; }
  ul.files { margin: 6px 0 0; padding-left: 18px; font-size: 13px; }
  .days { font-size: 13px; color: var(--muted); margin: -6px 0 14px; }
  .wait { color: var(--muted); font-size: 14px; }
  header .back { border: 0; background: none; color: var(--accent); font-size: 14px; padding: 4px 6px 4px 0; }
  header h1 span { color: var(--muted); font-weight: 400; }
  .tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
  .tool { display: flex; gap: 14px; align-items: flex-start; text-align: left; padding: 16px; border-radius: 12px; min-height: 120px; }
  .tool:hover { border-color: var(--accent); }
  .tool .ico { width: 42px; height: 42px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
  .tool .name { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
  .tool .desc { font-size: 13px; color: var(--muted); }
  .tool .stat { font-size: 12.5px; margin-top: 8px; }
  .hint { font-size: 12.5px; color: var(--muted); margin: 14px 2px 0; }
  .fold { font-size: 12.5px; color: var(--muted); margin: 14px 2px 6px; display: flex; gap: 6px; align-items: center; }
  .fold b { color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pickrow { display: flex; justify-content: space-between; align-items: center; margin: 2px 2px 10px; font-size: 13px; color: var(--muted); }
  .sets { display: grid; gap: 8px; margin-bottom: 12px; }
  .set { display: flex; align-items: center; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px 8px 10px; cursor: pointer; }
  .set.on { border-color: var(--accent); }
  .set img, .set .noimg { width: 72px; height: 48px; object-fit: cover; border-radius: 6px; background: var(--soft); flex: none; }
  .set .t { flex: 1; min-width: 0; font-size: 13.5px; }
  .set .t b { font-weight: 600; }
  .set input { width: 16px; height: 16px; accent-color: var(--accent); flex: none; }
  .opt { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .opt input { accent-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.go { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  code { font-size: 12px; background: var(--soft); padding: 2px 5px; border-radius: 5px; word-break: break-all; }
</style>
</head>
<body>
<main>
  <header>
    <button class="back" id="back" onclick="go('')" hidden>‹ Tools</button>
    <img src="/icon.png" alt="">
    <h1 id="title">ShotLoft</h1>
    <span class="ver" id="ver"></span>
  </header>
  <div id="update"></div>
  <div id="flash"></div>
  <section id="v-home"></section>
  <section id="v-backup" hidden>
    <div class="grid2">
      <div class="box" id="card"></div>
      <div class="box" id="folder"></div>
    </div>
    <div id="main"></div>
  </section>
  <section id="v-hdr" hidden>
    <div class="box" id="hdrfolder" style="margin-bottom:16px"></div>
    <div id="hdrmain"></div>
  </section>
</main>
<script>
const TOKEN = "__TOKEN__";
let S = null, planKey = null, flash = null, busy = false;

async function api(path, body) {
  const r = await fetch(path, { method: body === undefined ? "GET" : "POST", headers: { "X-Token": TOKEN, "Content-Type": "application/json" },
                                body: body === undefined ? undefined : JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || "Something went wrong.");
  return j;
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function human(n) { const u = ["B","KB","MB","GB","TB"]; let i = 0; while (n >= 1024 && i < 4) { n /= 1024; i++; } return (i ? n.toFixed(1) : n) + " " + u[i]; }
function plural(n, w) { return `${n.toLocaleString()} ${w}${n === 1 ? "" : "s"}`; }
function counts(p, v, x) { return [p ? plural(p, "photo") : "", v ? plural(v, "video") : "", x ? plural(x, "video info file") : ""].filter(Boolean).join(", ") || "nothing"; }
function sentence(p, v, x) { return counts(p, v, x).replace(/, ([^,]*)$/, " and $1"); }
const cardName = path => path.split(/[\\/]/).filter(Boolean).pop() || path;
function secs(s) { s = Math.round(s); return s < 60 ? `${s}s` : `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, "0")}s`; }
function shortPath(p) { const parts = p.split(/[\\/]/).filter(Boolean); return parts.length > 2 ? "… / " + parts.slice(-2).join(" / ") : p; }
function put(id, html, cls) {
  const el = document.getElementById(id);
  if (cls !== undefined && el.className !== cls) el.className = cls;
  if (el._html !== html) { el._html = html; el.innerHTML = html; return true; }
  return false;
}
function setFlash(kind, html) { flash = { kind, html, t: Date.now() }; render(); }

async function act(fn) {
  if (busy) return; busy = true;
  try { await fn(); } catch (e) { setFlash("bad", esc(e.message)); }
  busy = false; await refresh();
}
const pick = () => act(() => api("/api/pick", {}));
const setDest = path => act(() => api("/api/dest", { path }));
const backup = () => act(() => api("/api/import", {}));
const verify = () => act(() => api("/api/verify", {}));
const retry = () => act(async () => { await api("/api/reset", {}); planKey = null; });
async function eject() {
  await act(async () => {
    const r = await api("/api/eject", {});
    const ok = r.results.filter(x => x.ejected), bad = r.results.filter(x => !x.ejected);
    if (ok.length) setFlash("good", `<b>Ejected ${esc(ok.map(x => cardName(x.card)).join(", "))}.</b> You can take the card out now.`);
    if (bad.length) setFlash("bad", `Couldn't eject ${esc(cardName(bad[0].card))}. Please eject it from ${esc(S.file_manager)}. <span class="sub">(${esc(bad[0].details)})</span>`);
  });
}
async function trash() {
  await act(async () => {
    const r = await api("/api/trash", {});
    setFlash("good", `Moved ${plural(r.moved, "JPG")} to the ${esc(S.trash_name)}. You can restore them from there.`);
  });
}

function bar(p, title) {
  if (!p) return `<div class="panel"><div class="row"><span>${esc(title)}…</span></div><div class="bar"><div></div></div></div>`;
  const frac = Math.min(p.done / Math.max(p.total, 1), 1), pct = Math.floor(frac * 100);
  let detail = p.bytes ? `${p.files_done} of ${p.files_total} files · ${human(p.done)} of ${human(p.total)}` : `${p.done} of ${p.total} files`;
  if (p.bytes && p.elapsed > 2 && p.done && p.done < p.total) detail += ` · ${secs((p.total - p.done) / (p.done / p.elapsed))} left`;
  return `<div class="panel"><div class="row"><span><b style="color:var(--text)">${esc(title)}</b></span><span>${pct}%</span></div>
          <div class="bar"><div style="width:${pct}%"></div></div><div class="row"><span>${detail}</span></div></div>`;
}
function afterActions(extra) {
  return `<div class="actions">
    <button onclick="verify()">Check it's safe to format</button>
    <button onclick="eject()">Eject card</button>${extra || ""}</div>`;
}

function renderCard() {
  if (!S.cards.length)
    return put("card", `<div class="lbl">Memory card</div><div class="big wait">Put in a memory card</div><div class="sub">It shows up here by itself.</div>`, "box");
  put("card", S.cards.map(c => `<div class="lbl">Memory card</div><div class="big">${esc(c.name)}</div>
      <div class="sub">${counts(c.photos, c.videos)}</div>`).join(`<div style="height:8px"></div>`), "box");
}
function renderFolder() {
  if (!S.dest) {
    if (put("folder", `<div class="lbl">Backup folder</div><button onclick="pick()">Choose backup folder</button>
      <input type="text" id="typed" placeholder="or paste a folder path and press Enter">`, "box drop")) {
      const inp = document.getElementById("typed");
      inp.onkeydown = e => { if (e.key === "Enter" && inp.value.trim()) setDest(inp.value.trim()); };
    }
    return;
  }
  let status = S.free_bytes != null ? `${human(S.free_bytes)} free` : "";
  if (!S.dest_drive_connected) status = `<span class="bad">Drive ${esc(S.dest_drive)} isn't connected</span>`;
  else if (!S.dest_exists) status += ` · <span class="attn">will be created</span>`;
  put("folder", `<div class="lbl"><span>Backup folder</span><button class="link" onclick="pick()">Change</button></div>
    <div class="big" title="${esc(S.dest)}">${esc(shortPath(S.dest))}</div><div class="sub">${status}</div>`, "box");
}

function renderMain() { put("main", mainHtml()); }
function mainHtml() {
  const j = S.job;
  const ready = S.cards.length && S.dest && S.dest_drive_connected;
  const key = JSON.stringify([S.cards.map(c => c.path), S.dest]);
  if (!ready) { return `<p class="wait">${!S.cards.length ? "Waiting for a memory card…" : !S.dest ? "Choose where your backup should go." : "Waiting for the backup drive…"}</p>`; return; }
  if (key !== planKey && (!j || j.state !== "running")) {
    planKey = key;
    api("/api/plan", {}).then(refresh).catch(e => setFlash("bad", esc(e.message)));
    return bar(null, "Checking what's new");
  }
  if (!j) return bar(null, "Checking what's new");
  if (j.state === "error") return `<div class="msg bad">${esc(j.error)}</div><button onclick="retry()">Try again</button>`;
  if (j.state === "running") {
    const title = j.kind === "plan" ? "Checking what's new" : j.kind === "import" ? "Copying" :
                  (j.progress && j.progress.label === "Verifying" ? "Checking every file, byte by byte" : "Getting ready to check every file");
    return bar(j.progress, title);
  }
  const r = j.result;
  if (j.kind === "plan") {
    const newMain = !r.new_files ? "Nothing" : r.new_photos ? plural(r.new_photos, "photo") : r.new_videos ? plural(r.new_videos, "video") : plural(r.new_xml, "video info file");
    const oldMain = r.already_photos ? plural(r.already_photos, "photo") : r.already_videos ? plural(r.already_videos, "video") : "None yet";
    const daysTxt = r.days.length ? r.days.map(d => d.label.replace(/ \d{4}$/, "")).join(", ") : "";
    let html = `<div class="grid3">
      <div class="metric"><div class="sub">New</div><div class="n ${r.new_files ? "attn" : "good"}">${newMain}</div>
        <div class="sub">${r.new_files ? (r.new_photos && r.new_videos ? plural(r.new_videos, "video") + " · " : "") + human(r.needed_bytes) : "all backed up"}</div></div>
      <div class="metric"><div class="sub">Already backed up</div><div class="n good">${oldMain}</div>
        <div class="sub">${r.already_photos && r.already_videos ? plural(r.already_videos, "video") : "&nbsp;"}</div></div>
      <div class="metric"><div class="sub">Goes into</div><div class="n">${r.days.length ? plural(r.days.length, "day") : "—"}</div>
        <div class="sub" title="${esc(daysTxt)}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(daysTxt) || "&nbsp;"}</div></div></div>`;
    if (r.repairs) html += `<p class="days">Includes ${plural(r.repairs, "file")} missing from an earlier backup; they go back next to their partner.</p>`;
    if (!r.new_files) html += `<div class="msg good"><b>Everything on the card is already backed up.</b></div>` + afterActions();
    else if (!r.enough_space) html += `<div class="msg bad"><b>Not enough space.</b> ${human(r.needed_bytes)} needed, but only ${human(r.free_bytes)} is free on the backup drive. Free up some space or choose another folder.</div>`;
    else html += `<button class="primary" onclick="backup()">Back up ${sentence(r.new_photos, r.new_videos, r.new_xml)}</button>`;
    return html;
  }
  if (j.kind === "import") {
    let html = `<div class="msg ${r.errors.length ? "bad" : "good"}"><b>${r.errors.length ? "Some files weren't copied." : "Done:"}</b> ${sentence(r.photos, r.videos, r.xml)} backed up${r.seconds >= 1 ? " in " + secs(r.seconds) : ""}.</div>`;
    if (r.errors.length) html += `<ul class="files">${r.errors.slice(0, 10).map(e => `<li>${esc(e.file)} <span class="sub">${esc(e.error)}</span></li>`).join("")}</ul><button onclick="retry()">Try again</button>`;
    const extra = r.raw_jpg_pairs ? `<button onclick="trash()">Move ${plural(r.raw_jpg_pairs, "extra JPG")} to the ${esc(S.trash_name)}</button>` : "";
    if (r.raw_jpg_pairs) html += `<p class="days">${plural(r.raw_jpg_pairs, "photo")} ${r.raw_jpg_pairs === 1 ? "was" : "were"} shot as RAW + JPG, so the JPG is an extra copy.</p>`;
    return html + afterActions(extra);
  }
  if (j.kind === "verify") {
    let html = "";
    for (const c of r.cards) {
      const probs = c.missing.map(f => [f, "not in the backup"]).concat(c.different.map(f => [f, "backup copy is different"]));
      if (!probs.length) html += `<div class="msg good"><b>All ${c.files.toLocaleString()} files are safely backed up, byte for byte.</b><br>You can format this card in your camera.</div>`;
      else html += `<div class="msg bad"><b>${plural(probs.length, "file")} not safely backed up. Don't format this card yet.</b>
        <ul class="files">${probs.slice(0, 15).map(p => `<li>${esc(p[0])} <span class="sub">${esc(p[1])}</span></li>`).join("")}</ul>Back up again, then check again.</div>`;
      if (c.trashed_jpg) html += `<p class="days">${plural(c.trashed_jpg, "JPG")} you moved to the ${esc(S.trash_name)} ${c.trashed_jpg === 1 ? "isn't" : "aren't"} in the backup; the RAW files are safe.</p>`;
    }
    return html + `<div class="actions"><button onclick="eject()">Eject card</button></div>`;
  }
  return "";
}

// ---------------------------------------------------------------- tools and views
// The launch screen lists the tools; each tool is a view (#backup, #hdr). More tools go in TOOLS.
const ICONS = {
  backup: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l4 4v14H7z"/><path d="M10 3v4M13 3v4"/><path d="M12.5 11v6M10 14.5l2.5 2.5 2.5-2.5"/></svg>`,
  hdr: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="12" height="12" rx="2"/><rect x="6" y="5" width="12" height="12" rx="2" opacity=".6"/><rect x="9" y="3" width="12" height="12" rx="2" opacity=".35"/></svg>`,
};
const TOOLS = [
  { id: "backup", name: "Card Backup", desc: "Copy new photos and videos from a memory card into dated folders.",
    stat: () => S.job && S.job.state === "running" && S.job.kind === "import" ? `<span class="attn">Copying…</span>`
      : S.cards.length ? `<span class="attn">${esc(S.cards.map(c => c.name).join(", "))} connected</span>` : `<span class="sub">No card connected</span>` },
  { id: "hdr", name: "HDR Merge", desc: "Blend bracketed shots into one photo with detail in the brights and the darks.",
    stat: () => S.hdr_job && S.hdr_job.state === "running" ? `<span class="attn">${S.hdr_job.kind === "merge" ? "Merging…" : "Looking for brackets…"}</span>`
      : S.hdr_folder ? `<span class="sub">${esc(shortPath(S.hdr_folder))}</span>` : `<span class="sub">Choose a folder to start</span>` },
];
const view = () => TOOLS.some(t => t.id === location.hash.slice(1)) ? location.hash.slice(1) : "";
function go(id) { location.hash = id; }
window.addEventListener("hashchange", () => { flash = null; render(); });

function renderHome() {
  put("v-home", `<p class="wait" style="margin:0 2px 12px">What would you like to do?</p><div class="tools">` + TOOLS.map(t => `<button class="tool" onclick="go('${t.id}')">
      <div class="ico">${ICONS[t.id]}</div>
      <div><div class="name">${t.name}</div><div class="desc">${t.desc}</div><div class="stat">${t.stat()}</div></div></button>`).join("") + `</div>`);
}

// ---------------------------------------------------------------- HDR Merge
const H = { sets: null, setsJob: undefined, folder: undefined, sel: new Set(), tiff: false, scanned: undefined };
const evs = b => b.map(x => (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x)).join(", ");
const setName = s => s.names.length > 1 ? `${s.names[0].replace(/\.ARW$/i, "")}–${s.names[s.names.length - 1].replace(/\.ARW$/i, "").replace(/^\D+/, "")}` : s.names[0];
const hdrPick = () => act(() => api("/api/hdr/pick", {}));
const hdrSetFolder = path => act(() => api("/api/hdr/folder", { path }));
const hdrScan = () => act(() => api("/api/hdr/scan", {}));
const hdrMerge = () => act(() => api("/api/hdr/merge", { ids: [...H.sel], tiff: H.tiff }));
const hdrReveal = id => act(() => api("/api/reveal", { id }));
function hdrToggle(id) { H.sel.has(id) ? H.sel.delete(id) : H.sel.add(id); renderHdr(); }
function hdrAll(on) { H.sel = new Set(on ? H.sets.map(s => s.id) : []); renderHdr(); }
async function hdrLoadSets(jobId) {
  H.setsJob = jobId;
  const r = await api("/api/hdr/sets");
  H.sets = r.sets;
  if (H.sets) H.sel = new Set(H.sets.filter(s => !s.done).map(s => s.id));
  renderHdr();
}

function renderHdrFolder() {
  if (!S.hdr_folder) {
    if (put("hdrfolder", `<div class="lbl">Folder with bracketed shots</div><button onclick="hdrPick()">Choose folder</button>
      ${S.dest ? `<button onclick="hdrSetFolder(S.dest)">Use backup folder</button>` : ""}
      <input type="text" id="hdrtyped" placeholder="or paste a folder path and press Enter">
      <div class="sub" style="margin-top:6px">Your backup folder works: ShotLoft looks through every folder inside it.</div>`, "box drop")) {
      const inp = document.getElementById("hdrtyped");
      inp.onkeydown = e => { if (e.key === "Enter" && inp.value.trim()) hdrSetFolder(inp.value.trim()); };
    }
    return;
  }
  put("hdrfolder", `<div class="lbl"><span>Folder with bracketed shots</span><button class="link" onclick="hdrPick()">Change</button></div>
    <div class="big" title="${esc(S.hdr_folder)}">${esc(shortPath(S.hdr_folder))}</div>
    <div class="sub">${S.hdr_folder_exists ? "Searched with all its subfolders" : `<span class="bad">Not found. Is its drive connected?</span>`}</div>`, "box");
}

function renderHdr() {
  if (view() !== "hdr") return;
  renderHdrFolder();
  const j = S.hdr_job;
  if (S.hdr_missing) return put("hdrmain", `<div class="msg info">${esc(S.hdr_missing)}</div>`);
  if (!S.hdr_folder || !S.hdr_folder_exists) return put("hdrmain", "");
  // A new folder, or nothing scanned yet: look for bracket sets. Fresh results: fetch them once.
  if (H.folder !== S.hdr_folder) { H.folder = S.hdr_folder; H.sets = null; H.setsJob = undefined; }
  if (j && j.state === "done" && H.setsJob !== j.id) hdrLoadSets(j.id);
  if (H.sets === null && (!j || j.state !== "running") && H.scanned !== S.hdr_folder) { H.scanned = S.hdr_folder; hdrScan(); }
  if (j && j.state === "running") {
    const p = j.progress || { done: 0, total: 1 };
    const pct = Math.floor(Math.min(p.done / Math.max(p.total, 1), 1) * 100);
    const head = j.kind === "merge" ? `Merging ${esc((p.name || "").replace(/_HDR\.jpg$/, ""))}` : "Looking for bracketed shots";
    const stage = j.kind === "merge" ? (p.stage || "") : (p.stage || "Reading photos");
    const detail = j.kind === "merge" ? `${Math.min(Math.floor(p.done) + 1, p.total)} of ${plural(p.total, "set")} · about 30 seconds each`
      : stage === "Making previews" ? `${p.done} of ${plural(p.total, "set")}` : `${p.done.toLocaleString()} of ${plural(p.total, "photo")}`;
    return put("hdrmain", `<div class="panel"><div class="row"><span><b style="color:var(--text)">${head}</b> · ${esc(stage)}</span><span>${pct}%</span></div>
      <div class="bar"><div style="width:${pct}%"></div></div><div class="row"><span>${detail}</span></div></div>`);
  }
  let html = "";
  if (j && j.state === "error") html += `<div class="msg bad">${esc(j.error)}</div><button onclick="hdrScan()">Try again</button>`;
  if (j && j.state === "done" && j.kind === "merge" && j.result) {
    if (j.result.merged) html += `<div class="msg good"><b>Saved ${plural(j.result.merged, "HDR photo")}</b> in the HDR folder next to the shots they came from.</div>`;
    if (j.result.failed.length) html += `<div class="msg bad"><b>${plural(j.result.failed.length, "set")} couldn't be merged.</b><ul class="files">${j.result.failed.map(f => `<li>${esc(f.file)} <span class="sub">${esc(f.error)}</span></li>`).join("")}</ul></div>`;
  }
  if (H.sets === null) return put("hdrmain", html || `<p class="wait">Looking for bracketed shots…</p>`);
  if (!H.sets.length) return put("hdrmain", html + `<p class="wait">No bracketed shots in this folder or its subfolders. To use HDR Merge, shoot with your camera's exposure bracketing (BRK C), in RAW.</p>
    <button onclick="hdrScan()">Look again</button>`);
  const done = H.sets.filter(s => s.done).length;
  html += `<div class="pickrow"><span>${plural(H.sets.length, "set")} found${done ? `, ${done} already merged` : ""}</span>
    <span><button class="link" onclick="hdrAll(true)">Select all</button> · <button class="link" onclick="hdrAll(false)">None</button> · <button class="link" onclick="hdrScan()">Look again</button></span></div>`;
  let folder = null;
  html += H.sets.map(s => {
    let head = "";
    if (s.folder !== folder) { folder = s.folder; head = `<div class="fold">In <b>${esc(s.folder ? s.folder.split(/[\\/]/).join(" / ") : "this folder")}</b></div>`; }
    return head + `<label class="set${H.sel.has(s.id) ? " on" : ""}" style="margin-bottom:8px">
      <input type="checkbox" ${H.sel.has(s.id) ? "checked" : ""} onchange="hdrToggle(${s.id})">
      ${s.thumb ? `<img src="${s.thumb}" alt="">` : `<div class="noimg"></div>`}
      <div class="t"><b>${esc(s.date)} · ${esc(s.time)}</b> · ${esc(setName(s))}<div class="sub">${s.names.length} shots · ${evs(s.biases)} EV</div></div>
      ${s.done ? `<span class="sub good">Merged ✓ <button class="link" onclick="event.preventDefault(); hdrReveal(${s.id})">Show</button></span>` : ""}</label>`;
  }).join("");
  html += `<label class="opt" style="margin-top:12px"><input type="checkbox" ${H.tiff ? "checked" : ""} onchange="H.tiff = this.checked; renderHdr()"> Also save a 16-bit TIFF for editing (about 125 MB each)</label>`;
  const n = H.sel.size, redo = H.sets.filter(s => H.sel.has(s.id) && s.done).length;
  html += `<button class="primary" onclick="hdrMerge()" ${n ? "" : "disabled"}>${n ? `Merge ${plural(n, "set")} to HDR` : "Choose sets to merge"}</button>`;
  if (redo) html += `<p class="hint">${plural(redo, "set")} already merged will be made again.</p>`;
  put("hdrmain", html);
}

function render() {
  if (!S) return;
  document.getElementById("ver").textContent = "v" + S.version;
  document.getElementById("update").innerHTML = S.update ? `<div class="msg info"><b>A new version is available: v${esc(S.update.latest)}.</b> To update, run this line in ${navigator.platform.startsWith("Win") ? "PowerShell" : "Terminal"}:<br><code>${esc(S.update.line)}</code></div>` : "";
  document.getElementById("flash").innerHTML = flash && Date.now() - flash.t < 15000 ? `<div class="msg ${flash.kind}">${flash.html}</div>` : "";
  const v = view(), tool = TOOLS.find(t => t.id === v);
  for (const id of ["home", ...TOOLS.map(t => t.id)]) document.getElementById("v-" + id).hidden = (id === "home" ? v !== "" : id !== v);
  document.getElementById("back").hidden = !tool;
  put("title", tool ? `ShotLoft <span>· ${tool.name}</span>` : "ShotLoft");
  if (!tool) renderHome();
  if (v === "backup") { renderCard(); renderFolder(); renderMain(); }
  if (v === "hdr") renderHdr();
}
async function refresh() { try { S = await api("/api/state"); render(); } catch (e) {} }
const running = () => S && ((S.job && S.job.state === "running") || (S.hdr_job && S.hdr_job.state === "running"));
async function loop() { await refresh(); setTimeout(loop, running() ? 500 : 1500); }
loop();
</script>
</body>
</html>
