# Builds a standalone sony-import app (no Python needed) for each OS and tests it.
# Pushing a tag like v1.0.0 also publishes the apps as a GitHub Release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: sony-import-windows.exe
          - os: macos-latest          # Apple Silicon (M1 and newer)
            asset: sony-import-macos-apple-silicon.zip
          - os: macos-15-intel        # Intel Macs
            asset: sony-import-macos-intel.zip
          - os: ubuntu-22.04          # older glibc, so it runs on most distros
            asset: sony-import-linux.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the script
        run: python tests/smoke_test.py python sony-import.py

      - name: Build standalone app
        shell: bash
        run: |
          pip install pyinstaller
          ICON=""; if [ "$RUNNER_OS" = "Windows" ]; then ICON="--icon docs/icon.ico"; fi
          pyinstaller --onefile --name sony-import $ICON sony-import.py

      - name: Test the standalone app
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then APP=dist/sony-import.exe; else APP=dist/sony-import; fi
          python tests/smoke_test.py "$APP"

      - name: Package
        shell: bash
        run: |
          mkdir -p out
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/sony-import.exe "out/${{ matrix.asset }}"
          else
            # zip keeps the "executable" permission that a plain download would lose
            (cd dist && zip -q "../out/${{ matrix.asset }}" sony-import)
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}

  installer:
    # Runs install.sh the way users do (piped into bash) against the latest published release.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install with the one-line installer
        env:
          SONY_IMPORT_RAW: file://${{ github.workspace }}
          SONY_IMPORT_APPS_DIR: ${{ runner.temp }}/apps
          SONY_IMPORT_BIN_DIR: ${{ runner.temp }}/bin
          SONY_IMPORT_NO_REVEAL: "1"
        run: cat install.sh | bash
      - name: Check the installed app runs
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            APP="$RUNNER_TEMP/apps/Sony Import.app"
            test -x "$APP/Contents/MacOS/launcher"
            test -f "$APP/Contents/Resources/AppIcon.icns"
            plutil -lint "$APP/Contents/Info.plist"
            "$APP/Contents/Resources/sony-import" --version
          else
            test -f "$HOME/.local/share/applications/sony-import.desktop"
            "$RUNNER_TEMP/bin/sony-import" --version
          fi

  installer-windows:
    # Runs install.ps1 the way users do (irm | iex) in Windows PowerShell 5.1, against the latest release.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install with the one-line installer
        shell: powershell
        env:
          SONY_IMPORT_INSTALL_DIR: ${{ runner.temp }}\SonyImport
          SONY_IMPORT_START_MENU: ${{ runner.temp }}\StartMenu
        run: Get-Content install.ps1 -Raw | Invoke-Expression
      - name: Check the installed app runs
        shell: powershell
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'SonyImport\sony-import.exe'
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw 'the installed app did not run' }
          if (-not (Test-Path (Join-Path $env:RUNNER_TEMP 'StartMenu\Sony Import.lnk'))) { throw 'no Start menu shortcut' }
          if (Get-Item $exe -Stream Zone.Identifier -ErrorAction SilentlyContinue) { throw 'the app is marked as downloaded from the internet' }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes come from this version's section of CHANGELOG.md.
          if .github/scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md; then
            NOTES=(--notes-file notes.md)
          else
            echo "::warning::CHANGELOG.md has no section for $GITHUB_REF_NAME; using GitHub's automatic notes"
            NOTES=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "Sony Import ${GITHUB_REF_NAME#v}" "${NOTES[@]}"
