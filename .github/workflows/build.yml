# Builds the offcard desktop app for each system and tests it. Pushing a tag like v0.4.0
# also publishes the apps as a GitHub Release, with notes from CHANGELOG.md.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine:
    # The engine behind the app: copying, matching, repairs, verify, eject (from source).
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the engine
        run: python tests/smoke_test.py python engine.py

  app:
    # The desktop app on top of the engine: SwiftUI on a Mac, a Tauri tray app on Windows, the page
    # in a browser on Linux.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: offcard-windows.zip
          - os: macos-latest          # Apple Silicon (M1 and newer)
            asset: offcard-macos-apple-silicon.zip
          - os: macos-15-intel        # Intel Macs
            asset: offcard-macos-intel.zip
          - os: ubuntu-22.04          # older glibc, so it runs on most distros
            asset: offcard-linux.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the HDR libraries
        shell: bash
        run: |
          # rawpy stopped publishing Intel Mac wheels after 0.25.1; everywhere else, the newest
          # (newest LibRaw, so the newest cameras).
          RAWPY="rawpy==0.27.1"; [ "${{ matrix.os }}" = "macos-15-intel" ] && RAWPY="rawpy==0.25.1"
          pip install numpy==2.4.6 pillow==13.0.0 "$RAWPY"

      - name: Test the app from source
        run: |
          python hdr.py selftest
          python tests/app_test.py python offcard.py
          python tests/agent_test.py python offcard.py

      - name: Build the app
        shell: bash
        run: |
          pip install pyinstaller
          # Mac: a SwiftUI menu bar app with the engine inside (mac/build.sh). Windows: a Tauri tray
          # app with the engine beside it (desktop/). Linux: the page in the browser.
          SEP=":"; [ "$RUNNER_OS" = "Windows" ] && SEP=";"
          DATA=(--add-data "engine.py${SEP}." --add-data "hdr.py${SEP}." --add-data "ui${SEP}ui" --add-data "docs/icon.png${SEP}docs")
          case "$RUNNER_OS" in
            macOS)
              mac/build.sh dist
              # The tests drive the engine inside the app; the app itself checks it can start it.
              echo "APP=dist/offcard.app/Contents/Resources/engine/OffcardEngine" >> "$GITHUB_ENV"
              dist/offcard.app/Contents/MacOS/offcard --version
              dist/offcard.app/Contents/MacOS/offcard --check ;;
            Windows)
              # The engine is a console program: the app starts it with no console window, and any
              # PowerShell it runs then shows none either.
              pyinstaller --noconfirm --name OffcardEngine --icon docs/icon.ico "${DATA[@]}" offcard.py
              VERSION="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' engine.py)"
              sed -i "0,/^version = .*/s//version = \"$VERSION\"/" desktop/src-tauri/Cargo.toml
              sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" desktop/src-tauri/tauri.conf.json
              cargo build --release --manifest-path desktop/src-tauri/Cargo.toml
              mkdir -p dist/app
              cp desktop/src-tauri/target/release/offcard.exe dist/app/
              cp -R dist/OffcardEngine dist/app/engine
              powershell -NoProfile -Command '$p = Start-Process dist/app/offcard.exe -ArgumentList "--check" -Wait -PassThru; exit $p.ExitCode'
              echo "APP=dist/app/engine/OffcardEngine.exe" >> "$GITHUB_ENV" ;;
            Linux)
              pyinstaller --noconfirm --onefile --name offcard "${DATA[@]}" offcard.py
              echo "APP=dist/offcard" >> "$GITHUB_ENV" ;;
          esac

      - name: Test the built app
        shell: bash
        run: |
          python tests/app_test.py "$APP"
          python tests/agent_test.py "$APP"

      - name: Package
        shell: bash
        run: |
          mkdir -p out
          case "$RUNNER_OS" in
            macOS)   ditto -c -k --keepParent "dist/offcard.app" "out/${{ matrix.asset }}" ;;
            Windows) powershell -NoProfile -Command 'Compress-Archive -Path dist/app/* -DestinationPath out/${{ matrix.asset }}' ;;
            Linux)   (cd dist && zip -q "../out/${{ matrix.asset }}" offcard) ;;  # zip keeps the executable bit
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}

  installer:
    # Runs install.sh the way users do (piped into bash), installing the app built above,
    # then tests the installed app end to end.
    needs: app
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Install with the one-line installer
        env:
          OFFCARD_RAW: file://${{ github.workspace }}
          OFFCARD_APPS_DIR: ${{ runner.temp }}/apps
          OFFCARD_BIN_DIR: ${{ runner.temp }}/bin
          OFFCARD_NO_REVEAL: "1"
        run: OFFCARD_RELEASES="file://$PWD/out" bash -c 'cat install.sh | bash'
      - name: Test the installed app
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            APP="$RUNNER_TEMP/apps/offcard.app"
            test -f "$APP/Contents/Resources/AppIcon.icns"
            xattr -l "$APP" | grep -q quarantine && { echo "app is quarantined"; exit 1; }
            "$APP/Contents/MacOS/offcard" --check
            python tests/app_test.py "$APP/Contents/Resources/engine/OffcardEngine"
          else
            test -f "$HOME/.local/share/applications/offcard.desktop"
            python tests/app_test.py "$RUNNER_TEMP/bin/offcard"
          fi

  installer-windows:
    # Runs install.ps1 the way users do (irm | iex) in Windows PowerShell 5.1, installing the app
    # built above, then tests the installed app end to end.
    needs: app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: offcard-windows.zip
          path: out
      - name: Install with the one-line installer
        shell: powershell
        env:
          OFFCARD_INSTALL_DIR: ${{ runner.temp }}\offcard
          OFFCARD_START_MENU: ${{ runner.temp }}\StartMenu
        run: |
          $env:OFFCARD_RELEASES = ([System.Uri](Resolve-Path out).Path).AbsoluteUri
          Get-Content install.ps1 -Raw | Invoke-Expression
      - name: Test the installed app
        shell: powershell
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'offcard\offcard.exe'
          if (-not (Test-Path $exe)) { throw 'the app was not installed' }
          if (-not (Test-Path (Join-Path $env:RUNNER_TEMP 'StartMenu\offcard.lnk'))) { throw 'no Start menu shortcut' }
          if (Get-Item $exe -Stream Zone.Identifier -ErrorAction SilentlyContinue) { throw 'the app is marked as downloaded from the internet' }
          $check = Start-Process $exe -ArgumentList '--check' -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw "the installed app's engine didn't answer (code $($check.ExitCode))" }
          python tests/app_test.py (Join-Path $env:RUNNER_TEMP 'offcard\engine\OffcardEngine.exe')
          if ($LASTEXITCODE -ne 0) { throw 'the installed app failed its test' }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [engine, app, installer, installer-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes come from this version's section of CHANGELOG.md.
          if .github/scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md; then
            NOTES=(--notes-file notes.md)
          else
            echo "::warning::CHANGELOG.md has no section for $GITHUB_REF_NAME; using GitHub's automatic notes"
            NOTES=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" "${NOTES[@]}"
